<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>奥哥大转盘</title>

<style>
body{
margin:0;
background:white;
font-family:Arial;
text-align:center;
}

.title{
margin-top:40px;
font-size:40px;
font-weight:bold;
background:linear-gradient(90deg,red,orange,yellow,green,cyan,blue,purple,red);
background-size:400%;
-webkit-background-clip:text;
color:transparent;
animation:rainbow 5s linear infinite;
}

@keyframes rainbow{
0%{background-position:0%;}
100%{background-position:400%;}
}

.box{
margin:60px auto 20px;
width:300px;
height:120px;
border:3px solid black;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:bold;
}

.btn{
padding:12px 18px;
font-size:16px;
border:none;
background:black;
color:white;
border-radius:8px;
margin:10px;
}

.counter{
position:fixed;
right:20px;
top:120px;
font-size:18px;
font-weight:bold;
}

.footer{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
font-size:18px;
font-weight:bold;
background:linear-gradient(90deg,red,orange,yellow,green,cyan,blue,purple,red);
background-size:400%;
-webkit-background-clip:text;
color:transparent;
animation:rainbow 5s linear infinite;
}
</style>
</head>

<body>

<div class="title">奥哥大转盘</div>

<div class="counter">
抽奖次数：<span id="count">0</span><br>
机会：<span id="chance">1</span>
</div>

<div class="box" id="box">点击开始抽奖</div>

<button class="btn" onclick="start()">开始抽奖</button>

<div class="footer">奥哥出品 必是精品</div>

<script>

const prizes = [
"奥哥香吻",
"谢谢参与❤️",
"奥哥的香脚🦶",
"再来一次❤️"
];

let chance = 1;
let total = 0;

/* 🔊 音频系统 */
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

/* 🎵 单次音 */
function beep(freq, time){
let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.frequency.value = freq;
gain.gain.value = 1.0;

osc.start();
osc.stop(audioCtx.currentTime + time);
}

/* 💥 方法二：双音增强 */
function playDoubleBeep(){

beep(900, 0.12);

setTimeout(()=>{
beep(1200, 0.12);
},80);

}

/* 🎰 抽奖 */
function start(){

/* 🔊 点击立刻响 */
playDoubleBeep();

/* 没机会 */
if(chance <= 0){
document.getElementById("box").innerHTML = "没有抽奖机会";
return;
}

chance--;
total++;

document.getElementById("chance").innerHTML = chance;
document.getElementById("count").innerHTML = total;

let box = document.getElementById("box");
let count = 0;

let timer = setInterval(()=>{

box.innerHTML = prizes[Math.floor(Math.random()*prizes.length)];
count++;

if(count > 25){
clearInterval(timer);

let result = box.innerHTML;

/* 再来一次 */
if(result === "再来一次❤️"){
chance++;
box.innerHTML = "🎉 再来一次 +1机会 🎉";
playDoubleBeep();
return;
}

/* 特殊奖励 */
if(result === "奥哥香吻" || result === "奥哥的香脚🦶"){
box.innerHTML = "🎉 " + result + " 🎉<br>联系奥哥兑换❤️";
playDoubleBeep();
return;
}

/* 普通结果 */
box.innerHTML = "🎉 " + result + " 🎉";
playDoubleBeep();

}
},120);
}

</script>

</body>
</html>
